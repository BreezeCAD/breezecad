# Builds and tests BreezeCAD on Windows, Linux and macOS, and packs six
# ready-to-run builds — for each system a plain one and one for beta testers:
#
#   BreezeCAD-windows.zip        BreezeCAD-beta-windows.zip
#   BreezeCAD-linux.tar.gz       BreezeCAD-beta-linux.tar.gz
#   BreezeCAD-macos.zip          BreezeCAD-beta-macos.zip      (Apple Silicon)
#
# Every run keeps them as workflow artifacts (Actions → the run → Artifacts);
# pushes to `next` where every job is green also put all six into the
# pre-release "next-build" — a stable link to the freshest build.
#
# Modules are separate downloads and live in their own repositories
# (modules/list.txt): each platform takes the packages of its system from the
# latest release of every module (scripts/fetch-modules.sh → artifacts
# modules-<system>, the installer), and a green push to next or main puts them
# on the release page "modules" — one page listing every module, its
# description and its file per system.
name: build

# Documentation-only pushes build nothing. The platforms run side by side;
# one failing does not stop the others (only the publishing waits for all).
on:
  push:
    branches: [next, main]
    paths-ignore: ['docs/**', 'translations/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'translations/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # the installer's pictures go to the pr-assets branch
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-python
            git
            zip
      # OCCT: our own build, the same on every system (scripts/deps/build-occt.sh,
      # ADR-0001), kept in the Actions cache. The key: the script and the compiler.
      - name: OCCT cache key
        id: occt-key
        run: |
          echo "prefix=$(cygpath -m "$GITHUB_WORKSPACE")/.deps/occt" >> "$GITHUB_OUTPUT"
          echo "key=occt-windows-mingw-gcc$(gcc -dumpfullversion)-${{ hashFiles('scripts/deps/build-occt.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore OCCT
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: .deps/occt
          key: ${{ steps.occt-key.outputs.key }}
      - name: Build OCCT (first run)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          set +e
          CMAKE_PREFIX_PATH=/mingw64 SRC="$RUNNER_TEMP/occt-src" bash scripts/deps/build-occt.sh windows .deps/occt > occt.log 2>&1
          status=$?
          tail -4 occt.log
          exit $status
      # Saved before BreezeCAD builds: a failing build must not cost OCCT again.
      - name: Save OCCT
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/occt
          key: ${{ steps.occt-key.outputs.key }}
      - name: Versions
        run: |
          g++ --version | head -1
          cmake --version | head -1
          occt=$(awk '/define OCC_VERSION_COMPLETE/ {gsub(/"/, "", $3); print $3}' .deps/occt/include/opencascade/Standard_Version.hxx)
          echo "::notice title=Windows toolchain::$(g++ -dumpfullversion), OCCT $occt (cache: ${{ steps.occt.outputs.cache-hit == 'true' && 'hit' || 'built' }})"
          cat .deps/occt/occt-build.txt
          echo "OCCT_PREFIX=${{ steps.occt-key.outputs.prefix }}" >> "$GITHUB_ENV"
      - name: Configure
        # The online installer looks for its files in the release it belongs to:
        # main → the latest numbered release, anything else → next-build.
        run: OCCT_DIR=$OCCT_PREFIX/lib/cmake/opencascade cmake --preset windows-mingw -DBZ_SETUP_CHANNEL=${{ github.ref == 'refs/heads/main' && 'latest' || 'next-build' }}
      - name: Module packages (from their repositories)
        shell: bash   # Git Bash: gh is there, not in MSYS2
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-modules.sh windows build/windows-mingw/packages
      - name: Build
        id: build
        run: |
          export PATH="$(cygpath -u "$OCCT_PREFIX")/bin:$PATH"   # tests listed at build time load OCCT
          cmake --build --preset windows-mingw 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Test
        run: |
          set +e +o pipefail   # the msys2 shell runs with -e: keep going to name the crash
          export PATH="$(cygpath -u "$OCCT_PREFIX")/bin:$PATH"
          # A time limit: a test that hangs fails with its name instead of
          # holding the job for hours.
          ctest --preset windows-mingw --output-on-failure --timeout 1200 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # A crash prints no failed check: run again, naming each finished test case.
          if [ $status -ne 0 ]; then
            exe=$(find build/windows-mingw -name bz_tests.exe | head -1)
            timeout 1200 "$exe" -d 2>&1 | grep -vE "WARN|INFO|^$|^=+$" | tail -12 | sed 's/^/last cases: /' | tee -a test.log
            # Each test case alone: names every one that crashes.
            "$exe" -ltc --no-version 2>/dev/null | grep -vE "^\[doctest\]|^=+$|^$" | while IFS= read -r name; do
              timeout 300 "$exe" -tc="${name//,/\\,}" >/dev/null 2>&1 || echo "crashes, fails or hangs: $name"
            done | tee -a test.log
            # And once more under gdb for the backtrace of the first crash (frames only).
            timeout 1200 gdb -batch -ex run -ex bt --args "$exe" 2>&1 | grep -E "^#[0-9]+ " | head -40 \
              | sed -E 's/^(#[0-9]+) +0x[0-9a-f]+ in /\1 /; s/ from .*//' | sed 's/^/gdb: /' | tee -a test.log
          fi
          exit $status
      - name: Report failures
        if: failure()
        run: bash scripts/ci-annotate.sh build.log test.log
      - name: Package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p dist/BreezeCAD
          cp -r build/windows-mingw/bin/breezecad.exe build/windows-mingw/bin/assets dist/BreezeCAD/
          # No modules inside: they are separate packages (.bzmod) the user
          # installs in "Настройки → Модули".
          bash scripts/deploy-runtime.sh dist/BreezeCAD breezecad.exe "$(cygpath -u "$OCCT_PREFIX")/bin"
          ls dist/BreezeCAD/TK*.dll > /dev/null || { echo "::error title=Package::no OCCT libraries in the package"; exit 1; }
          # File Explorer previews and file-type icons: registered by the
          # installer, unused by the portable copy (a few hundred KB).
          mkdir -p dist/BreezeCAD/shell
          cp build/windows-mingw/bin/bz_thumbs.dll installer/icons/*.ico dist/BreezeCAD/shell/
          cp LICENSE dist/BreezeCAD/
          # The testers' build: the same program in "program/", the flag that turns
          # on reports, the launcher and the instructions on top.
          beta=dist/beta/BreezeCAD-beta
          mkdir -p "$beta/program"
          cp -r dist/BreezeCAD/. "$beta/program/"
          cp resources/beta/beta-tester.txt "$beta/program/"
          cp "resources/beta/Запустить BreezeCAD.bat" "resources/beta/ИНСТРУКЦИЯ для тестеров.txt" "$beta/"
      # The package on its own: only Windows' folders on PATH, so a DLL that
      # deploy-runtime.sh missed stops the start ("DLL not found", exit 127 /
      # 0xC0000135). The runner has no OpenGL 3: past the libraries the
      # program may stop at the window — that is enough here.
      - name: Start check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set +e
          mkdir -p shots
          BZ_SCREENSHOT="$(cygpath -w "$PWD/shots/windows.ppm"):40" PATH=/c/Windows/system32:/c/Windows \
            timeout 60 ./dist/BreezeCAD/breezecad.exe > start.log 2>&1
          status=$?
          case $status in
            127|3221225781|-1073741515)
              echo "::error title=Windows start check::a library is missing from the package (exit $status): $(tail -3 start.log | tr '\n' ' ' | cut -c1-300)"
              exit 1 ;;
          esac
          echo "::notice title=Windows start check::the package loaded its own $(ls dist/BreezeCAD/*.dll | wc -l) DLLs (OCCT: $(ls dist/BreezeCAD/TK*.dll | wc -l)) and ran (exit $status$([ -f shots/windows.ppm ] && echo ', drew a frame'))"
      - name: Zip for the release
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p release
          (cd dist && 7z a -tzip -bso0 ../release/BreezeCAD-windows.zip BreezeCAD)
          (cd dist/beta && 7z a -tzip -mcu=on -bso0 ../../release/BreezeCAD-beta-windows.zip BreezeCAD-beta)
      - name: Installer (online, offline, manifest)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          number=$(sed -n '/^project(/,/)/s/.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          suffix=$(sed -n 's/^set(BZ_VERSION_SUFFIX "\(.*\)")/\1/p' CMakeLists.txt | head -1)
          label="$number$suffix"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tag="v$(echo "$label" | tr '[:upper:]' '[:lower:]')"; else tag=next-build; fi
          modules=()
          for m in build/windows-mingw/packages/*.bzmod; do modules+=(--module "$m"); cp "$m" release/; done
          # Languages other than Russian and English: packs the installer downloads.
          python3 scripts/i18n/make-packs.py release
          for l in release/lang-*.zip; do [ -e "$l" ] && modules+=(--language "$l"); done
          python3 scripts/installer/make-manifest.py --version "$label" --tag "$tag" --program release/BreezeCAD-windows.zip \
            "${modules[@]}" -o release/setup-manifest.json
          cp build/windows-mingw/bin/BreezeCAD-Setup.exe release/
          python3 scripts/installer/pack-offline.py release/BreezeCAD-Setup.exe release/setup-manifest.json release \
            -o release/BreezeCAD-Setup-offline.exe
          ls -la release
      - name: Installer test (install, check, remove)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set +e
          target="$(cygpath -w "$RUNNER_TEMP")\\bz-install-test"
          dir=$(cygpath -u "$target")
          ./release/BreezeCAD-Setup-offline.exe --test-install "$target"
          echo "installer: $(cat "$dir.result" 2>/dev/null)"
          fail=0
          for f in breezecad.exe uninstall.exe installed.json installed-files.txt shell/bz_thumbs.dll shell/part.ico; do
            test -f "$dir/$f" || { echo "::error title=Installer::$f is missing after installation"; fail=1; }
          done
          reg.exe query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\BreezeCAD' > /dev/null || { echo "::error title=Installer::no Apps & features entry"; fail=1; }
          reg.exe query 'HKCU\Software\Classes\.bzc' > /dev/null || { echo "::error title=Installer::.bzc is not registered"; fail=1; }
          ls "$(cygpath -u "$APPDATA")/BreezeCAD/modules/"*.bzmod > /dev/null 2>&1 || { echo "::error title=Installer::the modules were not put in place"; fail=1; }
          cp "$dir/uninstall.exe" "$RUNNER_TEMP/bz-uninstall.exe"
          "$RUNNER_TEMP/bz-uninstall.exe" --uninstall --from-temp --dir "$target" --quiet
          test -e "$dir/breezecad.exe" && { echo "::error title=Installer::the program is still there after removal"; fail=1; }
          reg.exe query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\BreezeCAD' > /dev/null 2>&1 && { echo "::error title=Installer::the Apps & features entry stayed"; fail=1; }
          [ $fail = 0 ] && echo "::notice title=Installer::installed, registered and removed cleanly"
          exit $fail
      - name: Installer screens
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p shots/setup
          BZ_SETUP_SHOTS="$(cygpath -w "$PWD/shots/setup")" timeout 180 ./release/BreezeCAD-Setup.exe
          ls shots/setup
      # The same pictures where people can look at them without downloading
      # an archive: setup/ in the pr-assets branch (replaced every run).
      - name: Installer screens to pr-assets
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        shell: bash
        run: |
          ls shots/setup/*.png > /dev/null 2>&1 || exit 0
          git clone -q --depth 1 --branch pr-assets "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pa
          rm -rf pa/setup && mkdir -p pa/setup && cp shots/setup/*.png pa/setup/
          cd pa
          git add -A setup
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "setup screens: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" || exit 0
          git push -q origin pr-assets
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: setup-screens
          path: shots/setup
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: BreezeCAD-windows
          path: dist/BreezeCAD
          retention-days: 30
      # The modules: separate packages, installed in "Настройки → Модули".
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: modules-windows
          path: build/windows-mingw/packages/*.bzmod
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: BreezeCAD-beta-windows
          path: dist/beta
          retention-days: 30
      # The two zips as they go to the release, for the publish job.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: release-windows
          path: release
          compression-level: 0
          retention-days: 3

  linux:
    # The Linux package is built with conda-forge's GCC 13 against glibc 2.28
    # (GLFW and FreeType from conda-forge too; OCCT our own, built with the
    # same compiler): the package runs on distributions from 2019 on; the
    # system's own packages would tie it to the build machine's glibc.
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the OCCT archive for Claude's sandbox goes to the release dev-deps
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: System packages (OpenGL, X11, Xvfb for the start check)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libx11-6 libxrandr2 \
            libxinerama1 libxcursor1 libxi6 libxxf86vm1 libfontconfig1
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bz
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            cmake ninja gxx_linux-64=13 sysroot_linux-64=2.28
            freetype fontconfig glfw libgl-devel xorg-libx11 xorg-libxi
            xorg-libxrandr xorg-libxinerama xorg-libxcursor xorg-libxext xorg-xorgproto
          cache-environment: true
      # OCCT: our own build, the same on every system (scripts/deps/build-occt.sh,
      # ADR-0001), kept in the Actions cache.
      - name: Restore OCCT
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: .deps/occt
          key: occt-linux-conda-gcc13-glibc228-${{ hashFiles('scripts/deps/build-occt.sh') }}
      - name: Build OCCT (first run)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          set +e
          CMAKE_PREFIX_PATH="$CONDA_PREFIX" SRC="$RUNNER_TEMP/occt-src" bash scripts/deps/build-occt.sh linux .deps/occt > occt.log 2>&1
          status=$?
          tail -4 occt.log
          exit $status
      - name: Save OCCT
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/occt
          key: ${{ steps.occt.outputs.cache-primary-key }}
      # The same OCCT for Claude's cloud sandbox (scripts/dev/cloud-setup.sh):
      # the release dev-deps, replaced when the script changes. Not from pull
      # requests (no write rights there).
      - name: OCCT archive for the sandbox
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          want=$(sha256sum scripts/deps/build-occt.sh | cut -d' ' -f1)   # cloud-setup.sh compares the same
          have=$(gh release download dev-deps -p bz-occt-linux-x64.sha -O - 2>/dev/null || true)
          if [ "$have" = "$want" ]; then echo "dev-deps already has this OCCT"; exit 0; fi
          tar -C .deps/occt -I 'xz -6 -T0' -cf bz-occt-linux-x64.tar.xz .
          echo "$want" > bz-occt-linux-x64.sha
          gh release view dev-deps > /dev/null 2>&1 || gh release create dev-deps --prerelease --title "Зависимости для облачной песочницы" \
            --notes "Для разработки, не для пользователей: OCCT для Linux x86_64, тот же, что в сборках (scripts/deps/build-occt.sh). Распаковывает scripts/dev/cloud-setup.sh."
          gh release upload dev-deps bz-occt-linux-x64.tar.xz bz-occt-linux-x64.sha --clobber
          echo "::notice title=dev-deps::OCCT archive for the sandbox updated ($(du -h bz-occt-linux-x64.tar.xz | cut -f1))"
      - name: Versions
        run: |
          $CXX --version | head -1
          occt=$(awk '/define OCC_VERSION_COMPLETE/ {gsub(/"/, "", $3); print $3}' .deps/occt/include/opencascade/Standard_Version.hxx)
          echo "::notice title=Linux toolchain::$($CXX -dumpfullversion), OCCT $occt (cache: ${{ steps.occt.outputs.cache-hit == 'true' && 'hit' || 'built' }}), GLFW $(grep -h 'define GLFW_VERSION_M' "$CONDA_PREFIX"/include/GLFW/glfw3.h | awk '{printf "%s.", $3}')"
          cat .deps/occt/occt-build.txt
      - name: Configure
        run: cmake --preset linux-release -DCMAKE_PREFIX_PATH="$PWD/.deps/occt;$CONDA_PREFIX" -DOpenCASCADE_DIR="$PWD/.deps/occt/lib/cmake/opencascade"
          -DBZ_SETUP_STATIC_GLFW=ON -DBZ_SETUP_CHANNEL=${{ github.ref == 'refs/heads/main' && 'latest' || 'next-build' }}
      - name: Module packages (from their repositories)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-modules.sh linux build/linux-release/packages
      # Three at a time: with OCCT 8 headers four compilers at once ran the
      # runner out of memory, which killed the build without a message.
      - name: Build
        id: build
        run: |
          set +e
          cmake --build --preset linux-release -j 3 > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Once more, alone: says what stopped it when the first run did not.
            echo "::warning title=Build::stopped with $status after: $(tail -2 build.log | tr '\n' ' ' | cut -c1-300)"
            cmake --build --preset linux-release -j 1 -- -v >> build.log 2>&1
            status=$?
            echo "::notice title=Build again::exit $status: $(tail -8 build.log | tr '\n' ' ' | cut -c1-900)"
          fi
          exit $status
      # No pipes here: in this login shell a pipe's status came out as 1 for a
      # clean run (ctest passed, the step failed).
      - name: Test
        run: |
          set +e
          ctest --preset linux-release --output-on-failure > test.log 2>&1
          status=$?
          tail -5 test.log
          exit $status
      - name: Report failures
        if: failure()
        run: |
          bash scripts/ci-annotate.sh build.log test.log
          echo "::notice title=Memory::$(free -m | awk 'NR==2 {print $2 " MB, used " $3}'); $(dmesg 2>/dev/null | grep -ci 'killed process') kills"
      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bash scripts/package-linux.sh build/linux-release/bin release
          bash scripts/package-linux.sh build/linux-release/bin release --beta
          n=$(tar -tzf release/BreezeCAD-linux.tar.gz | grep -c 'lib/libTK' || true)
          [ "$n" -gt 0 ] || { echo "::error title=Package::no OCCT libraries in the Linux package"; exit 1; }
      # The installer, as on Windows: online (downloads what is chosen) and
      # offline (everything inside), from the same package as a ZIP.
      - name: Installer (Linux)
        id: installer
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          number=$(sed -n '/^project(/,/)/s/.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          suffix=$(sed -n 's/^set(BZ_VERSION_SUFFIX "\(.*\)")/\1/p' CMakeLists.txt | head -1)
          label="$number$suffix"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tag="v$(echo "$label" | tr '[:upper:]' '[:lower:]')"; else tag=next-build; fi
          mkdir -p setup-linux
          python3 scripts/installer/tar2zip.py release/BreezeCAD-linux.tar.gz setup-linux/BreezeCAD-linux.zip
          python3 scripts/i18n/make-packs.py setup-linux
          args=()
          for m in build/linux-release/packages/*.bzmod; do [ -e "$m" ] && args+=(--module "$m") && cp "$m" setup-linux/; done
          for l in setup-linux/lang-*.zip; do [ -e "$l" ] && args+=(--language "$l"); done
          python3 scripts/installer/make-manifest.py --version "$label" --tag "$tag" --program setup-linux/BreezeCAD-linux.zip \
            "${args[@]}" -o setup-linux/setup-manifest-linux.json
          cp build/linux-release/bin/BreezeCAD-Setup-linux release/
          strip release/BreezeCAD-Setup-linux
          python3 scripts/installer/pack-offline.py release/BreezeCAD-Setup-linux setup-linux/setup-manifest-linux.json setup-linux \
            -o release/BreezeCAD-Setup-linux-offline
          chmod +x release/BreezeCAD-Setup-linux release/BreezeCAD-Setup-linux-offline
          cp setup-linux/setup-manifest-linux.json setup-linux/BreezeCAD-linux.zip release/
          glibc=$(objdump -T release/BreezeCAD-Setup-linux | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "::notice title=Linux installer::$(du -h release/BreezeCAD-Setup-linux | cut -f1) online, $(du -h release/BreezeCAD-Setup-linux-offline | cut -f1) offline; needs $glibc; $(ldd release/BreezeCAD-Setup-linux | wc -l) libraries"
          # The whole installation without the pages, into a fresh home.
          export HOME=$(mktemp -d)
          ./release/BreezeCAD-Setup-linux-offline --test-install "$HOME/.local/share/BreezeCAD/app"
          test -x "$HOME/.local/share/BreezeCAD/app/breezecad" || { echo "::error title=Linux installer::the program is not there"; exit 1; }
          test -f "$HOME/.local/share/applications/breezecad.desktop" || { echo "::error title=Linux installer::no menu entry"; exit 1; }
          "$HOME/.local/share/BreezeCAD/app/breezecad-setup" --uninstall --quiet
          test ! -e "$HOME/.local/share/BreezeCAD/app/breezecad" || { echo "::error title=Linux installer::removal left the program"; exit 1; }
      - name: Pictures of the Linux installer
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p shots/setup-linux
          BZ_SETUP_SHOTS="$PWD/shots/setup-linux" timeout 180 xvfb-run -a -s "-screen 0 1600x1000x24" env -u LD_LIBRARY_PATH \
            ./release/BreezeCAD-Setup-linux
          echo "::notice title=Linux installer pages::$(ls shots/setup-linux | wc -l) pictures"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        with:
          name: release-linux-setup
          path: |
            release/BreezeCAD-Setup-linux
            release/BreezeCAD-Setup-linux-offline
            release/setup-manifest-linux.json
            release/BreezeCAD-linux.zip
            setup-linux/lang-*.zip
          compression-level: 0
          retention-days: 3
      # Outside the build environment, from the unpacked archive: does it start?
      - name: Start check
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/start shots && tar -C /tmp/start -xzf release/BreezeCAD-linux.tar.gz
          mv .deps/occt .deps/occt.away   # the package must not reach the build's OCCT
          set +e
          timeout 120 xvfb-run -a -s "-screen 0 1600x1000x24" env -u LD_LIBRARY_PATH \
            BZ_SCREENSHOT="$PWD/shots/linux.ppm:40" /tmp/start/BreezeCAD/breezecad > start.log 2>&1
          status=$?
          if [ -f shots/linux.ppm ]; then
            python3 scripts/ppm2png.py shots/linux.ppm shots/start-linux.png --half && rm shots/linux.ppm
            echo "::notice title=Linux start check::the packaged program started and drew a frame ($(grep -m1 'OpenGL' start.log | cut -c1-120)); $(grep -m1 'Touchpad' start.log | cut -c14-200)"
          else
            echo "::warning title=Linux start check::no frame (exit $status): $(tail -5 start.log | tr '\n' ' ' | cut -c1-400)"
            mv .deps/occt.away .deps/occt
            exit 1
          fi
      # A part opened: the real screen must change (Linux froze on the last
      # picture before the first 3D render until 2026-10). Pictures of the X
      # screen, not of the program's buffer, which looked right regardless.
      - name: Screen with a document open
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          command -v import > /dev/null || sudo apt-get install -y -qq imagemagick > /dev/null
          bash scripts/ci-document-screen.sh /tmp/start/BreezeCAD/breezecad 96
      # The settings' touchpad tab as a picture in the annotations (artifacts
      # and logs cannot always be downloaded, annotations can).
      - name: Picture of the touchpad settings
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 120 xvfb-run -a -s "-screen 0 1600x1000x24" env -u LD_LIBRARY_PATH BZ_SETTINGS_TAB=1.2 \
            BZ_SCREENSHOT="$PWD/shots/touchpad.ppm:60" /tmp/start/BreezeCAD/breezecad > settings.log 2>&1
          size=$(head -c 20 shots/touchpad.ppm | tr '\n' ' ' | awk '{print $2, $3}')
          read -r w h <<< "$size"
          python3 scripts/ppm2png.py shots/touchpad.ppm shots/settings-touchpad.png \
            --crop $(( (w - 780) / 2 )),$(( h > 860 ? (h - 860) / 2 : 0 )),780,860 --annotate "settings touchpad" && rm shots/touchpad.ppm
      # The crash and hang windows on the real package (BZ_FAULT_TEST): the
      # program crashes (or freezes), its window must come up with a report.
      - name: Picture of the crash window
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: bash scripts/ci-fault-window.sh crash /tmp/start/BreezeCAD/breezecad 97
      - name: Picture of the hang window
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: bash scripts/ci-fault-window.sh hang /tmp/start/BreezeCAD/breezecad 98
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: BreezeCAD-linux
          path: release/BreezeCAD-linux.tar.gz
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: BreezeCAD-beta-linux
          path: release/BreezeCAD-beta-linux.tar.gz
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: modules-linux
          path: build/linux-release/packages/*.bzmod
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: start-check-linux
          path: shots
          if-no-files-found: ignore
          retention-days: 7

  linux-occt76:
    # The system OCCT of Ubuntu 24.04 (7.6, the oldest supported): keeps the
    # code building with it, as local development uses it. Not packaged.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libglfw3-dev libgl1-mesa-dev \
            libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev \
            libocct-visualization-dev libocct-data-exchange-dev libocct-ocaf-dev \
            libfreetype-dev libfontconfig1-dev libtbb-dev libxi-dev
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Test
        run: ctest --preset linux-release --output-on-failure 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report failures
        if: failure()
        run: bash scripts/ci-annotate.sh build.log test.log

  macos:
    # Apple Silicon only (arm64); Homebrew's bottles here are built for
    # macOS 15, which is the oldest system the app supports (macos-14 retired 2.11.2026).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install ninja glfw freetype dylibbundler
      # OCCT: our own build, the same on every system (scripts/deps/build-occt.sh,
      # ADR-0001), kept in the Actions cache. The key: the script and the compiler.
      - name: OCCT cache key
        id: occt-key
        run: echo "key=occt-macos-arm64-$(clang++ --version | head -1 | tr -cd '[:alnum:].-' | cut -c1-60)-${{ hashFiles('scripts/deps/build-occt.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore OCCT
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: .deps/occt
          key: ${{ steps.occt-key.outputs.key }}
      - name: Build OCCT (first run)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          set +e
          CMAKE_PREFIX_PATH="$(brew --prefix)" SRC="$RUNNER_TEMP/occt-src" bash scripts/deps/build-occt.sh macos "$PWD/.deps/occt" > occt.log 2>&1
          status=$?
          tail -4 occt.log
          exit $status
      - name: Save OCCT
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/occt
          key: ${{ steps.occt-key.outputs.key }}
      - name: Versions
        run: |
          clang++ --version | head -1
          occt=$(awk '/define OCC_VERSION_COMPLETE/ {gsub(/"/, "", $3); print $3}' .deps/occt/include/opencascade/Standard_Version.hxx)
          echo "::notice title=macOS toolchain::$(sw_vers -productVersion) $(uname -m), $(clang++ --version | head -1), OCCT $occt (cache: ${{ steps.occt.outputs.cache-hit == 'true' && 'hit' || 'built' }}), GLFW $(brew list --versions glfw | awk '{print $2}')"
          cat .deps/occt/occt-build.txt
          echo "BZ_OCCT_PREFIX=$PWD/.deps/occt" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset macos -DCMAKE_PREFIX_PATH="$BZ_OCCT_PREFIX;$(brew --prefix)" -DOpenCASCADE_DIR="$BZ_OCCT_PREFIX/lib/cmake/opencascade"
      - name: Module packages (from their repositories)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-modules.sh macos build/macos/packages
      - name: Build
        id: build
        run: cmake --build --preset macos 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Test
        run: ctest --preset macos --output-on-failure 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report failures
        if: failure()
        run: bash scripts/ci-annotate.sh build.log test.log
      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bash scripts/package-macos.sh build/macos/bin release
          bash scripts/package-macos.sh build/macos/bin release --beta
          n=$(unzip -l release/BreezeCAD-macos.zip | grep -c 'Frameworks/libTK' || true)
          [ "$n" -gt 0 ] || { echo "::error title=Package::no OCCT libraries in the macOS package"; exit 1; }
      # Finder's side: the types are the app's, Quick Look draws the picture a
      # part keeps inside (the thumbnail extension), the disk image mounts.
      - name: File types, thumbnails and the disk image
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5   # Quick Look / mdls hung for hours on macos-15
        run: |
          mkdir -p /tmp/ql shots && ditto -x -k release/BreezeCAD-macos.zip /tmp/ql
          app=/tmp/ql/BreezeCAD.app
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          pluginkit -a "$app/Contents/PlugIns/BreezeCADThumbnails.appex" || true
          ext=$(pluginkit -m -p com.apple.quicklook.thumbnail -v 2>/dev/null | grep -i breezecad || true)
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("/tmp/ql/Пример.bzc", "w")
          z.writestr("manifest.json", "{}")
          z.write("installer/icons/png/part.png", "preview.png")
          z.close()
          PY
          uti=$(mdls -name kMDItemContentType -raw /tmp/ql/Пример.bzc 2>/dev/null || true)
          qlmanage -t -s 256 -o shots /tmp/ql/Пример.bzc > ql.log 2>&1 || true
          thumb=$(ls shots/*.bzc.png 2>/dev/null | head -1)
          hdiutil attach -nobrowse -readonly release/BreezeCAD-macos.dmg > dmg.log && mounted=yes || mounted=no
          [ "$mounted" = yes ] && ls /Volumes/BreezeCAD > dmg-list.txt && hdiutil detach -quiet /Volumes/BreezeCAD
          echo "::notice title=macOS Finder::type: ${uti:-?}; extension: ${ext:-not registered}; thumbnail: ${thumb:-none ($(tail -1 ql.log))}; dmg: $mounted ($(tr '\n' ' ' < dmg-list.txt 2>/dev/null)) $(du -h release/BreezeCAD-macos.dmg | cut -f1)"
      # From the unpacked zip, with Homebrew's libraries moved away: does the
      # app start on its own?
      - name: Start check
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/start shots && ditto -x -k release/BreezeCAD-macos.zip /tmp/start
          cellar="$(brew --prefix)/Cellar"
          sudo mv "$cellar" "$cellar.away"
          mv "$BZ_OCCT_PREFIX" "$BZ_OCCT_PREFIX.away"
          ( sleep 120; pkill -9 breezecad ) & watchdog=$!
          set +e
          BZ_SCREENSHOT="$PWD/shots/macos.ppm:40" /tmp/start/BreezeCAD.app/Contents/MacOS/breezecad > start.log 2>&1
          status=$?
          set -e
          kill $watchdog 2>/dev/null || true
          sudo mv "$cellar.away" "$cellar"
          mv "$BZ_OCCT_PREFIX.away" "$BZ_OCCT_PREFIX"
          if [ -f shots/macos.ppm ]; then
            python3 scripts/ppm2png.py shots/macos.ppm shots/start-macos.png && rm shots/macos.ppm
            echo "::notice title=macOS start check::the packaged app started and drew a frame ($(grep -m1 'OpenGL' start.log | cut -c1-120))"
          elif grep -q "starting" start.log && grep -q "suitable pixel format" start.log; then
            # The runners are virtual machines without OpenGL: reaching the
            # window means every library of the bundle loaded and ran.
            echo "::notice title=macOS start check::the packaged app started with its own libraries (Homebrew and the OCCT build moved away) and reached the window; the runner has no OpenGL, so no frame here"
          else
            echo "::warning title=macOS start check::no frame (exit $status): $(tail -5 start.log | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: BreezeCAD-macos
          path: |
            release/BreezeCAD-macos.zip
            release/BreezeCAD-macos.dmg
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: BreezeCAD-beta-macos
          path: release/BreezeCAD-beta-macos.zip
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: modules-macos
          path: build/macos/packages/*.bzmod
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: start-check-macos
          path: shots
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # Only when every platform built and passed its tests.
    needs: [windows, linux, linux-occt76, macos]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to update the next-build pre-release
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-windows, path: release }
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-linux, path: release }
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-beta-linux, path: release }
      - uses: actions/download-artifact@v4
        with: { name: release-linux-setup, path: release-linux }
      - name: Linux installer files
        run: |
          cp release-linux/release/* release/
          chmod +x release/BreezeCAD-Setup-linux release/BreezeCAD-Setup-linux-offline
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-macos, path: release }
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-beta-macos, path: release }
      - name: Publish the next-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(BreezeCAD-windows.zip BreezeCAD-beta-windows.zip BreezeCAD-linux.tar.gz BreezeCAD-beta-linux.tar.gz
                 BreezeCAD-macos.zip BreezeCAD-macos.dmg BreezeCAD-beta-macos.zip
                 BreezeCAD-Setup.exe BreezeCAD-Setup-offline.exe setup-manifest.json
                 BreezeCAD-Setup-linux BreezeCAD-Setup-linux-offline setup-manifest-linux.json BreezeCAD-linux.zip)
          for f in "${files[@]}"; do test -s "release/$f" || { echo "::error::missing $f"; exit 1; }; done
          # The modules the online installer downloads from this release.
          for m in release/*.bzmod release/lang-*.zip; do [ -e "$m" ] && files+=("$(basename "$m")"); done
          notes="Свежая сборка ветки next: коммит ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M') UTC.

          Windows 10/11 (64-бит):
          • BreezeCAD-Setup.exe — установщик: скачивает программу и выбранные модули, регистрирует файлы и превью в Проводнике, обновляет установленную версию.
          • BreezeCAD-Setup-offline.exe — тот же установщик со всем внутри, сеть не нужна.
          • BreezeCAD-windows.zip — без установки: распаковать и запустить BreezeCAD/breezecad.exe.
          • BreezeCAD-beta-windows.zip — для бета-тестеров: с отчётами об ошибках, внутри «ИНСТРУКЦИЯ для тестеров.txt».

          Linux (x86_64; Ubuntu 20.04+, Debian 10+, Fedora и другие не старше 2019 года):
          • BreezeCAD-Setup-linux — установщик: скачивает программу и выбранное, добавляет её в меню, типы файлов и превью (chmod +x и запустить).
          • BreezeCAD-Setup-linux-offline — тот же установщик со всем внутри.
          • BreezeCAD-linux.tar.gz — обычная: распаковать и запустить BreezeCAD/breezecad.
          • BreezeCAD-beta-linux.tar.gz — для бета-тестеров: внутри «Запустить BreezeCAD.sh» и «ИНСТРУКЦИЯ для тестеров.txt».

          macOS 15+ на процессорах Apple (M1 и новее):
          • BreezeCAD-macos.dmg — образ диска: открыть и перетащить BreezeCAD в «Программы». Файлы деталей и сборок открываются в BreezeCAD, в Finder видны их картинки.
          • BreezeCAD-macos.zip — обычная: распаковать и открыть BreezeCAD.app. Первый запуск — правой кнопкой → «Открыть»; на macOS 15+ — «Системные настройки → Конфиденциальность и безопасность → Всё равно открыть».
          • BreezeCAD-beta-macos.zip — для бета-тестеров: внутри BreezeCAD.app и «ИНСТРУКЦИЯ для тестеров.txt»."
          if ! gh release view next-build >/dev/null 2>&1; then
            gh release create next-build --prerelease --target "$GITHUB_SHA" --title "BreezeCAD — свежая сборка (next)" --notes "$notes"
          fi
          gh release upload next-build "${files[@]/#/release/}" --clobber
          gh release edit next-build --notes "$notes"

  release:
    # A push to main is a numbered release: BreezeCAD <version> with its notes
    # (docs/releases/<label>.md) and the same six builds. Re-running only
    # replaces the files of that release.
    needs: [windows, linux, linux-occt76, macos]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-windows, path: release }
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-linux, path: release }
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-beta-linux, path: release }
      - uses: actions/download-artifact@v4
        with: { name: release-linux-setup, path: release-linux }
      - name: Linux installer files
        run: |
          cp release-linux/release/* release/
          chmod +x release/BreezeCAD-Setup-linux release/BreezeCAD-Setup-linux-offline
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-macos, path: release }
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-beta-macos, path: release }
      - name: Publish the numbered release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(BreezeCAD-windows.zip BreezeCAD-beta-windows.zip BreezeCAD-linux.tar.gz BreezeCAD-beta-linux.tar.gz
                 BreezeCAD-macos.zip BreezeCAD-macos.dmg BreezeCAD-beta-macos.zip
                 BreezeCAD-Setup.exe BreezeCAD-Setup-offline.exe setup-manifest.json
                 BreezeCAD-Setup-linux BreezeCAD-Setup-linux-offline setup-manifest-linux.json BreezeCAD-linux.zip)
          for f in "${files[@]}"; do test -s "release/$f" || { echo "::error::missing $f"; exit 1; }; done
          for m in release/*.bzmod release/lang-*.zip; do [ -e "$m" ] && files+=("$(basename "$m")"); done
          number=$(sed -n '/^project(/,/)/s/.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          suffix=$(sed -n 's/^set(BZ_VERSION_SUFFIX "\(.*\)")/\1/p' CMakeLists.txt | head -1)
          label="$number$suffix"                                   # 0.2.1-Beta
          tag="v$(echo "$label" | tr '[:upper:]' '[:lower:]')"     # v0.2.1-beta
          notes_file="docs/releases/$(echo "$label" | tr '[:upper:]' '[:lower:]').md"
          test -s "$notes_file" || { echo "::error::no release notes: $notes_file"; exit 1; }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "BreezeCAD $label" --notes-file "$notes_file" --latest
          fi
          gh release upload "$tag" "${files[@]/#/release/}" --clobber
          echo "::notice title=Release::BreezeCAD $label published as $tag"

  modules:
    # The page of modules: the release "modules" (not a version of the
    # program, never "Latest") with every module's packages for every system
    # and a list — name, version, what it does, which file is for which
    # system — made from the modules' own module.json. Packages of a version
    # no longer built are taken down, so the page shows only current ones.
    needs: [windows, linux, linux-occt76, macos]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: modules-*, path: packages, merge-multiple: true }
      - name: Publish the modules page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls packages/*.bzmod >/dev/null || { echo "::error::no module packages"; exit 1; }
          python3 scripts/modules-page.py modules packages > notes.md
          if ! gh release view modules >/dev/null 2>&1; then
            gh release create modules --target "$GITHUB_SHA" --title "Модули BreezeCAD" --notes-file notes.md --latest=false
          fi
          gh release upload modules packages/*.bzmod --clobber
          gh release edit modules --notes-file notes.md --latest=false
          # Older versions off the page.
          for old in $(gh release view modules --json assets --jq '.assets[].name'); do
            test -f "packages/$old" || gh release delete-asset modules "$old" --yes
          done
          echo "::notice title=Modules::$(ls packages | wc -l) packages on the release page \"modules\""
